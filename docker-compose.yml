version: "3.8"

services:
  autonomous-data-analyst:
    build: .
    container_name: autonomous-data-analyst
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./:/app
    restart: unless-stopped
